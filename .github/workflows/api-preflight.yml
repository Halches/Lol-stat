name: Riot and GRID API preflight
on:
  push:
    branches: [codex/api-preflight-2026-11-21]
    paths: [.github/workflows/api-preflight.yml]
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Riot Match-V5 and GRID drafts
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          GRID_API_KEY: ${{ secrets.GRID_API_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone
          
          class RequestFailure(Exception):
              pass
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          
          opener = urllib.request.build_opener(NoRedirect())
          
          def request(url, headers, data=None):
              if data is not None:
                  headers = dict(headers, **{"Content-Type": "application/json"})
                  data = json.dumps(data).encode()
              try:
                  with opener.open(urllib.request.Request(url, headers=headers, data=data), timeout=10) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 403 and error.headers.get_content_type() == "text/html":
                      raise RequestFailure("http_403_html_gateway") from None
                  if error.code in (400, 403):
                      try:
                          body = json.load(error)
                      except (ValueError, OSError):
                          body = {}
                      if isinstance(body, dict):
                          if isinstance(body.get("errors"), list):
                              return body
                          message = str((body.get("status") or {}).get("message", "")).lower()
                          if "expired" in message:
                              raise RequestFailure(f"http_{error.code}_expired_key") from None
                          if "invalid" in message and "key" in message:
                              raise RequestFailure(f"http_{error.code}_invalid_key") from None
                  raise RequestFailure(f"http_{error.code}") from None
              except (OSError, ValueError):
                  raise RequestFailure("network_or_invalid_json") from None
          
          def riot(key):
              base = "https://europe.api.riotgames.com"
              headers = {"X-Riot-Token": key, "User-Agent": "LoLHelper/0.1"}
              stage = "account"
              try:
                  account = request(base + "/riot/account/v1/accounts/by-riot-id/Halch/9200", headers)
                  puuid = account["puuid"]
                  print("Riot account: ok")
                  stage = "history"
                  matches = request(base + "/lol/match/v5/matches/by-puuid/"
                                    + urllib.parse.quote(puuid, safe="") + "/ids?queue=420&count=20", headers)
                  match_id = next((value for value in matches if re.fullmatch(r"EUW1_[0-9]{1,20}", value)), None)
                  if not match_id:
                      return "no_euw_solo_matches"
                  print("Riot Solo/Duo history: ok")
                  path = base + "/lol/match/v5/matches/" + match_id
                  stage = "details"
                  match = request(path, headers)
                  if match["metadata"]["matchId"] != match_id or match["info"]["queueId"] != 420 or not any(
                      player.get("puuid") == puuid for player in match["info"]["participants"]
                  ):
                      return "details_invalid"
                  print("Riot match detail: ok")
                  stage = "timeline"
                  timeline = request(path + "/timeline", headers)
                  if timeline["metadata"]["matchId"] != match_id or not timeline["info"]["frames"]:
                      return "timeline_invalid"
                  print("Riot timeline: ok")
                  return "ready"
              except RequestFailure as error:
                  return f"{stage}_{error}"
              except (TypeError, KeyError, AttributeError):
                  return f"{stage}_invalid_response"
          
          def riot_direct(key):
              path = "https://europe.api.riotgames.com/lol/match/v5/matches/EUW1_8051208426"
              stage = "details"
              try:
                  detail = request(path, {"X-Riot-Token": key, "User-Agent": "LoLHelper/0.1"})
                  if detail["metadata"]["matchId"] != "EUW1_8051208426" or detail["info"]["queueId"] != 420:
                      return "details_invalid"
                  stage = "timeline"
                  timeline = request(path + "/timeline", {"X-Riot-Token": key, "User-Agent": "LoLHelper/0.1"})
                  if timeline["metadata"]["matchId"] != "EUW1_8051208426" or not timeline["info"]["frames"]:
                      return "timeline_invalid"
                  return "ready"
              except RequestFailure as error:
                  return f"{stage}_{error}"
              except (TypeError, KeyError, AttributeError):
                  return f"{stage}_invalid_response"
          
          def riot_timeline_direct(key):
              match_id = "EUW1_8051208426"
              url = "https://europe.api.riotgames.com/lol/match/v5/matches/" + match_id + "/timeline"
              try:
                  result = request(url, {"X-Riot-Token": key, "User-Agent": "LoLHelper/0.1"})
                  if result["metadata"]["matchId"] == match_id and result["info"]["frames"]:
                      return "ready"
                  return "invalid_response"
              except RequestFailure as error:
                  return str(error)
              except (TypeError, KeyError, AttributeError):
                  return "invalid_response"

          def gql(host, path, key, query, variables):
              answer = request(host + path, {"x-api-key": key}, {"query": query, "variables": variables})
              if answer.get("errors"):
                  for error in answer["errors"]:
                      kind = (error.get("extensions") or {}).get("errorType")
                      if kind == "UNAUTHENTICATED":
                          raise RequestFailure("unauthenticated")
                      if kind == "PERMISSION_DENIED" or "forbidden" in str(error.get("message", "")).lower():
                          raise RequestFailure("permission_denied")
                  messages = " ".join(str(e.get("message", "")).lower() for e in answer["errors"])
                  for phrase, kind in (("unknown argument", "unknown_argument"),
                                       ("cannot query field", "unknown_field"), ("unknown type", "unknown_type"),
                                       ("used in position expecting type", "variable_type_mismatch"),
                                       ("must be filtered", "required_filter")):
                      if phrase in messages:
                          raise RequestFailure(kind)
                  raise RequestFailure("graphql_query_rejected")
              return answer["data"]
          
          UTC = timezone.utc
          CENTRAL = "\nquery Recent($from: String!, $until: String!) {\n  allSeries(first: 15, orderBy: StartTimeScheduled, orderDirection: DESC,\n    filter: {titleId: \"3\", startTimeScheduled: {gte: $from, lte: $until}}) {\n    edges { node { id startTimeScheduled tournament { name } teams { baseInfo { id name } } } }\n  }\n}\n"
          DRAFT = "\nquery Draft($id: ID!) {\n  seriesState(id: $id) {\n    finished\n    games {\n      sequenceNumber finished\n      draftActions { type sequenceNumber draftable { type name } }\n    }\n  }\n}\n"
          
          class SourceError(Exception):
              def __init__(self, kind):
                  self.kind = kind
          
          def recent(self):
              now = datetime.now(UTC).replace(microsecond=0)
              metadata = self.query("/central-data/graphql", CENTRAL,
                                    {"from": (now - timedelta(days=30)).isoformat(), "until": now.isoformat()})
              series = []
              for edge in metadata["allSeries"]["edges"][:8]:
                  node = edge["node"]
                  try:
                      value = self.query("/live-data-feed/series-state/graphql", DRAFT, {"id": node["id"]})
                  except SourceError as error:
                      if error.kind == "pending":
                          continue
                      raise
                  state = value.get("seriesState") or {}
                  if not state.get("finished"):
                      continue
                  games = []
                  for game in state.get("games") or []:
                      if not game.get("finished"):
                          continue
                      actions = []
                      for action in game.get("draftActions") or []:
                          draftable = action.get("draftable") or {}
                          kind = str(action.get("type", "")).lower()
                          if kind in ("pick", "ban") and draftable.get("name"):
                              actions.append({"kind": kind, "champion": draftable["name"],
                                              "order": int(action["sequenceNumber"])})
                      if actions:
                          games.append({"number": game["sequenceNumber"],
                                        "actions": sorted(actions, key=lambda action: action["order"])})
                  series.append({"id": node["id"], "startsAt": node["startTimeScheduled"],
                                 "teams": [team["baseInfo"]["name"] for team in node["teams"]],
                                 "tournament": (node.get("tournament") or {}).get("name"), "games": games})
              return series
          
          def grid(host, key):
              from types import SimpleNamespace
          
              def query(path, document, variables):
                  try:
                      return gql(host, path, key, document, variables)
                  except RequestFailure as error:
                      raise SourceError("pending" if str(error) == "http_404" else str(error)) from None
          
              try:
                  records = recent(SimpleNamespace(query=query))
                  print(f"GRID beta adapter completed series: {len(records)}")
                  for record in records:
                      if not record["teams"] or not record["startsAt"]:
                          return "invalid_series_metadata"
                      for game in record["games"]:
                          if {"pick", "ban"} <= {action["kind"] for action in game["actions"]}:
                              print("GRID beta adapter picks and bans: ok")
                              return "ready"
                  return "no_complete_draft"
              except SourceError as error:
                  return error.kind
              except (ValueError, AttributeError, TypeError, KeyError):
                  return "invalid_response"
          
          def secret(name):
              value = os.getenv(name, "").strip()
              if len(value) >= 2 and value[0] == value[-1] and value[0] in "\"'":
                  return value[1:-1].strip()
              return value
          
          riot_key = secret("RIOT_API_KEY")
          grid_key = secret("GRID_API_KEY")
          results = {"Riot": riot(riot_key) if riot_key else "github_secret_missing"}
          if riot_key and results["Riot"] != "ready":
              results["Riot direct Match-V5"] = riot_direct(riot_key)
              if results["Riot direct Match-V5"] != "ready":
                  results["Riot direct timeline"] = riot_timeline_direct(riot_key)
          grid_ok = False
          for label, host in (("GRID Open Access", "https://api-op.grid.gg"), ("GRID Portal", "https://api.grid.gg")):
              status = grid(host, grid_key) if grid_key else "github_secret_missing"
              results[label] = status
              if status == "ready":
                  grid_ok = True
                  break
              if not grid_key:
                  break
          for label, status in results.items():
              print(f"RESULT {label}: {status}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              for label, status in results.items():
                  print(f"- {label}: {status}", file=summary)
          raise SystemExit(0 if results["Riot"] == "ready" and grid_ok else 1)
          PY
# Fresh diagnostic run after RIOT_API_KEY rotation.
