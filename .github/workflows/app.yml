name: Сборка LoL Helper

on:
  push:
    branches: [main]
    paths: ['app/**', '!app/data.json', '!app/silero/**', '.github/workflows/app.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Тесты логики
        run: python app/test_core.py

      - name: Piper и голос Дмитрий
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip -OutFile piper.zip
          Expand-Archive piper.zip -DestinationPath .
          Get-ChildItem piper | Select-Object -First 20 Name
          New-Item -ItemType Directory voices | Out-Null
          $hf = "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/ru/ru_RU/dmitri/medium/ru_RU-dmitri-medium.onnx"
          Invoke-WebRequest $hf -OutFile voices/ru_RU-dmitri-medium.onnx
          Invoke-WebRequest "$hf.json" -OutFile voices/ru_RU-dmitri-medium.onnx.json

      - name: Картинки (портреты, предметы, руны, эмблемы)
        shell: bash
        run: |
          pip install --quiet pillow
          mkdir -p tools/dd
          V=$(curl -s https://ddragon.leagueoflegends.com/api/versions.json | python -c "import json,sys;print(json.load(sys.stdin)[0])")
          echo "$V" > tools/dd/ver
          for f in champion item summoner runesReforged; do curl -s -o tools/dd/$f.json https://ddragon.leagueoflegends.com/cdn/$V/data/ru_RU/$f.json; done
          mv tools/dd/runesReforged.json tools/dd/runes.json
          python app/make_assets.py

      - name: Голоса для скачивания из программы (релиз voices, один раз)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view voices *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "voices уже есть"; exit 0 }
          New-Item -ItemType Directory vdl | Out-Null
          foreach ($v in "denis","dmitri","irina","ruslan") {
            $hf = "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/ru/ru_RU/$v/medium/ru_RU-$v-medium.onnx"
            Invoke-WebRequest $hf -OutFile "vdl/ru_RU-$v-medium.onnx"
            Invoke-WebRequest "$hf.json" -OutFile "vdl/ru_RU-$v-medium.onnx.json"
          }
          gh release create voices (Get-ChildItem vdl).FullName --title "Голоса Piper для LoL Helper" --notes "Русские голоса Piper (rhasspy/piper-voices v1.0.0), скачиваются программой по выбору." --latest=false

      - name: Собрать exe
        shell: pwsh
        run: |
          $v = "v1.0.${{ github.run_number }}"
          Set-Content app/version.txt $v -NoNewline
          "VERSION=$v" | Out-File $env:GITHUB_ENV -Append
          pip install --quiet pyinstaller==6.11.1 pillow edge-tts==7.3.1 pywebview==5.3.2
          pyinstaller --noconfirm --onefile --noconsole --name LoLHelper --paths app --hidden-import PIL._tkinter_finder `
            --collect-all edge_tts --collect-all webview --collect-all clr_loader --collect-all pythonnet --collect-data certifi --hidden-import clr --hidden-import sitewin `
            --add-data "app/data.json;." --add-data "app/assets.json;." --add-data "app/version.txt;." `
            --add-data "piper;piper" --add-data "voices;voices" app/lolhelper.py
          Get-Item dist/LoLHelper.exe | Select-Object Name, Length

      - name: Самопроверка exe
        shell: pwsh
        run: |
          $p = Start-Process dist/LoLHelper.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content dist/selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Релиз
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $log = git log -5 --format="- %s" -- app
          gh release create $env:VERSION dist/LoLHelper.exe --title "LoL Helper $env:VERSION" --notes "Изменения:`n$($log -join "`n")"
