name: Сборка основной версии LoL Helper

on:
  push:
    branches: [main]
    paths: ['beta/desktop/**', 'beta/tests/**', 'beta/web/loadout.json', 'beta/RELEASE_NOTES.txt', 'app/core.py', 'app/lcu.py', 'app/rune_catalog.py', '.github/workflows/app.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: '${{ github.workspace }}/app;${{ github.workspace }}/beta'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Зависимости
        run: |
          python -m pip install PySide6-Essentials==6.12.0 Pillow==13.0.0 opencv-python-headless==4.11.0.86 numpy==2.2.6 pyinstaller==6.22.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Версия и ресурсы
        run: |
          $v = python -c "from desktop.app_version import VERSION; from desktop.update_service import version_number; assert version_number(VERSION); print(VERSION)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VERSION=$v" | Out-File $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Path beta/.state -Force | Out-Null
          python beta/desktop/worker.py --catalog beta/.state/catalog.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from desktop.voice_audio import VoicePack; p=VoicePack(); assert len(p.voices)==5, 'Incomplete voice pack'; print('Voice pack: OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Проверки
        run: |
          python -m unittest discover -s beta/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Сборка и проверка EXE
        working-directory: beta
        run: |
          python -m PyInstaller --noconfirm --workpath .state/qt-build --distpath out desktop/qt.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $p = Start-Process out/LoLHelperBeta-Qt.exe -ArgumentList '--smoke' -WindowStyle Hidden -PassThru
          if (-not $p.WaitForExit(120000)) { throw 'Smoke check timeout' }
          if ($p.ExitCode -ne 0) { throw 'Smoke check failed' }
          # The old updater's fallback expects this exact asset name.
          Copy-Item out/LoLHelperBeta-Qt.exe out/LoLHelper.exe
          $hash = (Get-FileHash out/LoLHelper.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  LoLHelper.exe" | Set-Content out/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: LoLHelper-${{ env.VERSION }}
          path: |
            beta/out/LoLHelper.exe
            beta/out/SHA256SUMS.txt
      - name: Выпуск для обновления приложения
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:VERSION *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Version already published. Increase desktop/app_version.py before releasing.' }
          # A draft prevents clients seeing an incomplete pair of assets.
          gh release create $env:VERSION beta/out/LoLHelper.exe beta/out/SHA256SUMS.txt --draft --title "LoL Helper $env:VERSION" --notes-file beta/RELEASE_NOTES.txt --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $env:VERSION --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
