name: Обновление игр

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      test_fire:
        description: "Проверить запуск обновления в Claude без новых игр"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: update-games
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
      INCREMENTAL: "1"
    steps:
      - name: Проверить ключ
        id: key
        run: |
          if [ -z "$RIOT_API_KEY" ]; then
            echo "::notice::Секрет RIOT_API_KEY не задан, пропускаю."
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
            K=$(printf '%s' "$RIOT_API_KEY" | tr -d '[:space:]"')
            if printf '%s' "$K" | grep -Eq '^RGAPI-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then echo "Формат ключа верный (длина ${#K})"; else echo "::warning::Секрет RIOT_API_KEY не похож на ключ Riot: длина ${#K}, начало '${K:0:6}'"; fi
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == '1'

      - uses: actions/setup-python@v5
        if: steps.key.outputs.ok == '1'
        with:
          python-version: "3.12"

      - name: Проверять новые игры каждые 10 минут (около 5,5 часа)
        if: steps.key.outputs.ok == '1'
        working-directory: tools
        env:
          GH_TOKEN: ${{ github.token }}
          FIRE_URL: ${{ secrets.CLAUDE_FIRE_URL }}
          FIRE_TOKEN: ${{ secrets.CLAUDE_FIRE_TOKEN }}
          TEST_FIRE: ${{ inputs.test_fire || false }}
        run: |
          pip install --quiet pillow
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash update_loop.sh
