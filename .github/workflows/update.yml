name: Обновление игр

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      test_fire:
        description: "Проверить запуск обновления в Claude без новых игр"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: update-games
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
      INCREMENTAL: "1"
    steps:
      - name: Проверить ключ
        id: key
        run: |
          if [ -z "$RIOT_API_KEY" ]; then
            echo "::notice::Секрет RIOT_API_KEY не задан, пропускаю."
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
            K=$(printf '%s' "$RIOT_API_KEY" | tr -d '[:space:]"')
            if printf '%s' "$K" | grep -Eq '^RGAPI-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then echo "Формат ключа верный (длина ${#K})"; else echo "::warning::Секрет RIOT_API_KEY не похож на ключ Riot: длина ${#K}, начало '${K:0:6}'"; fi
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == '1'

      - uses: actions/setup-python@v5
        if: steps.key.outputs.ok == '1'
        with:
          python-version: "3.12"

      - name: Найти новые игры
        id: fetch
        if: steps.key.outputs.ok == '1'
        working-directory: tools
        run: python fetch.py

      - name: Пересобрать сайт
        if: steps.fetch.outputs.new != '' && steps.fetch.outputs.new != '0'
        working-directory: tools
        run: |
          pip install --quiet pillow
          mkdir -p dd
          V=$(curl -s https://ddragon.leagueoflegends.com/api/versions.json | python -c "import json,sys;print(json.load(sys.stdin)[0])")
          echo "$V" > dd/ver
          for f in champion item summoner; do curl -s -o dd/$f.json https://ddragon.leagueoflegends.com/cdn/$V/data/ru_RU/$f.json; done
          curl -s -o dd/runes.json https://ddragon.leagueoflegends.com/cdn/$V/data/ru_RU/runesReforged.json
          python analyze.py
          python icons.py
          # средние Изумруд+ с lolalytics: обновлять раз в 3 дня
          python -c "import json,time,sys;t=json.load(open('lola.json')).get('_t','2000-01-01');sys.exit(0 if time.time()-time.mktime(time.strptime(t,'%Y-%m-%d'))>3*86400 else 1)" && python lola.py || true
          python build.py
          python ../app/make_data.py

      - name: Опубликовать
        if: steps.fetch.outputs.new != '' && steps.fetch.outputs.new != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data tools/games.json tools/icons.json tools/seen.json tools/ranks.json tools/lp_history.json tools/lola.json app/data.json
          git commit -m "Новые игры: ${{ steps.fetch.outputs.new }}" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true

      - name: Обновить версию в Claude
        if: (steps.fetch.outputs.new != '' && steps.fetch.outputs.new != '0') || inputs.test_fire
        env:
          FIRE_URL: ${{ secrets.CLAUDE_FIRE_URL }}
          FIRE_TOKEN: ${{ secrets.CLAUDE_FIRE_TOKEN }}
        run: |
          if [ -z "$FIRE_URL" ] || [ -z "$FIRE_TOKEN" ]; then
            echo "::notice::CLAUDE_FIRE_URL/CLAUDE_FIRE_TOKEN не заданы, версию в Claude не трогаю."
            exit 0
          fi
          curl -sS -X POST "$FIRE_URL" \
            -H "Authorization: Bearer $FIRE_TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d '{}' -o fire.json -w "HTTP %{http_code}\n" || echo "::warning::Не удалось запустить обновление в Claude"
          head -c 300 fire.json | sed 's/"[a-z_]*token[a-z_]*":"[^"]*"/"token":"***"/g'; echo
